name: gate3 plants

on:
  pull_request:

permissions:
  contents: read

jobs:
  plants:
    runs-on: ubuntu-24.04
    # A draft test PR's job; closed unmerged.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: bash .github/gate3-plants.sh
