name: Plant T9 (fix 13 item 4, throwaway)

# A draft test PR only, never merged: a package vouched for by another Ubuntu
# release's genuine signed list must be refused. The control: the verifier
# before fix 13 (63c1f7f) accepts the same planted set, so the plant is real.

on:
  pull_request:

permissions:
  contents: read

jobs:
  t9:
    name: t9
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/check-environment
        with:
          ubuntu-release: noble
          spreadsheet-app: 'true'
      - name: Plant jammy's signed list and one of its packages into a copy of the LibreOffice set
        run: |
          set -euo pipefail
          source .github/scripts/limit.sh
          work="$RUNNER_TEMP/t9"; mkdir -p "$work"
          limit 120 "jammy restricted list" curl -fsS -o "$work/list.xz" http://archive.ubuntu.com/ubuntu/dists/jammy/restricted/binary-amd64/Packages.xz
          limit 120 "jammy package" curl -fsS -o "$work/pkg.deb" http://archive.ubuntu.com/ubuntu/pool/restricted/l/linux-restricted-modules/linux-modules-nvidia-510-generic-hwe-20.04_5.15.0-25.25_amd64.deb
          cp -a "$HOME/libreoffice-debs" "$work/set"
          cp .github/ci-hashes/other-release/archive.ubuntu.com_ubuntu_dists_jammy_InRelease "$work/set/lists/"
          cp "$work/list.xz" "$work/set/lists/archive.ubuntu.com_ubuntu_dists_jammy_restricted_binary-amd64_Packages.xz"
          cp "$work/pkg.deb" "$work/set/linux-modules-nvidia-510-generic-hwe-20.04_5.15.0-25.25_amd64.deb"
          echo "== PLANT: fix 13's verifier on the planted set (must refuse)"
          rc=0; python3 -I .github/scripts/verify-installs.py debs "$work/set" noble libreoffice-calc > "$work/new.txt" 2>&1 || rc=$?
          cat "$work/new.txt"; echo "exit $rc"
          echo "== CONTROL: the verifier before fix 13 (63c1f7f) on the same planted set"
          git show 63c1f7f:.github/scripts/verify-installs.py > "$work/old-verify.py"
          orc=0; python3 -I "$work/old-verify.py" debs "$work/set" > "$work/old.txt" 2>&1 || orc=$?
          cat "$work/old.txt"; echo "exit $orc"
          [ "$rc" -eq 1 ] && grep -q "archive.ubuntu.com_ubuntu_dists_jammy_InRelease: signed for Ubuntu jammy, not noble" "$work/new.txt" \
            && grep -q "linux-modules-nvidia-510-generic-hwe-20.04_5.15.0-25.25_amd64.deb: in no signed Ubuntu noble list" "$work/new.txt" \
            && echo "T9 REFUSED, by name" || { echo "T9 NOT REFUSED"; exit 1; }
