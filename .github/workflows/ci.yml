name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    # Measured: the slowest run of this job, about twice over. A hang stops here, not at GitHub's 6 hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the two guards below that read COMMIT MESSAGES would
          # see one synthetic merge commit at depth 1.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint

      - name: No real personal data in the repository
        run: node .github/scripts/check-no-real-data.js --self-test

      - run: npm run check-no-real-data

      - name: No commercial value of a deployment (self-test)
        run: node .github/scripts/check-no-commercial-values.js --self-test

      - name: No commercial value of a deployment (this pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-no-commercial-values.js "$BASE..$HEAD"

      - name: No commercial value of a deployment (whole history)
        if: github.event_name != 'pull_request'
        run: node .github/scripts/check-no-commercial-values.js

      - name: No name from outside this project (self-test)
        run: node .github/scripts/check-no-sibling-names.js --self-test

      - name: No name from outside this project (this pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-no-sibling-names.js "$BASE..$HEAD"

      - name: No name from outside this project (whole history)
        if: github.event_name != 'pull_request'
        run: node .github/scripts/check-no-sibling-names.js

  checks:
    name: checks
    # Every check of the source and the downloaded files that needs no
    # browser. Their controls run beside them in `controls`; `test` below is
    # green only when both are, so no result here is read without its
    # control having failed first in the same run.
    runs-on: ubuntu-latest
    # Measured: the slowest run of this job, about twice over. A hang stops here, not at GitHub's 6 hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/check-environment
        with:
          spreadsheet-app: 'true'
          # The install checks' own controls: a changed package, an unlisted
          # one, a changed list, a changed InRelease, each refused by name.
          controls: 'true'

      - name: No technical words, in either language
        run: npm run check-plain-words
      - name: Nothing readable outside the dictionaries
        run: npm run check-readable-text
      - name: The two languages match
        run: npm run check-languages-match
      - name: Text against background, by day and by night
        run: npm run check-contrast
      - name: No colour from the first look
        run: npm run check-old-colours
      - name: Quick Find, the look, the language, the one place that talks to the platform
        run: npm test
      - name: The page never touches the session, and asks only its own origin
        run: npm run check-page-stays-home
      - name: Home says only what it shows
        run: npm run check-home-claims
      - name: Every field has a short description, in both languages
        run: npm run check-descriptions
      - name: The downloaded files hold the list, read back by readers we did not write
        # openpyxl and pypdf, and LibreOffice reading every Excel file as a
        # spreadsheet app does. (Numbers, on a Mac: SPREADSHEET_READERS=numbers.)
        env:
          SPREADSHEET_READERS: libreoffice
        run: npm run check-files
      - name: No word of ours split inside the word, in any PDF, either language
        run: npm run check-pdf-words
      - name: The installer drawings -- one number table, Draft 7 carried over, both units, each garage's own set, no gate box, 11 x 17 in pages read back
        run: npm run check-drawings
      - name: No dependency with a known high or critical problem
        run: npm audit --audit-level=high

  controls:
    name: controls (${{ matrix.shard }}/6)
    # Every check above, shown failing first: each control plants one break
    # in a scratch copy of the repository and requires the check to fail and
    # name it. The controls are spread over 6 runners by their measured
    # minutes (scripts/fail-controls-times.json); `test` below proves the
    # shards add up to one whole run.
    runs-on: ubuntu-latest
    # Measured: the slowest run of this job, about twice over. A hang stops here, not at GitHub's 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/check-environment
        with:
          spreadsheet-app: 'true'
      - name: Every check, shown failing first (this shard)
        run: npm run fail-controls -- --shard ${{ matrix.shard }}/6
      - name: This shard's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fail-controls-plain-shard-${{ matrix.shard }}
          path: fail-controls-plain-shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          overwrite: true

  test:
    # The name branch protection requires. It runs whatever happened above and
    # is green only when `checks` and every `controls` shard are: a job that
    # failed, was cancelled or was skipped makes it red. It then requires the
    # shards to add up to one whole run -- every control exactly once, none
    # missing, none twice, none that did not fail as required -- and names
    # what does not.
    name: test
    if: always()
    needs: [checks, controls]
    runs-on: ubuntu-latest
    # Measured: the slowest run of this job, about twice over. A hang stops here, not at GitHub's 6 hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: fail-controls-plain-shard-*
          merge-multiple: true
          path: fail-controls-shards
      - name: Every control exactly once, each caught and named
        run: node scripts/fail-controls.js --verify fail-controls-shards
      - name: Every part of the tests passed
        if: always()
        env:
          CHECKS: ${{ needs.checks.result }}
          CONTROLS: ${{ needs.controls.result }}
        run: |
          echo "checks: $CHECKS, controls: $CONTROLS"
          [ "$CHECKS" = success ] && [ "$CONTROLS" = success ]

  browser-checks:
    name: browser-checks
    # The built site, in a browser. Its controls run beside it in
    # `browser-controls`; `browser` below is green only when both are.
    runs-on: ubuntu-latest
    # Measured: the slowest run of this job, about twice over. A hang stops here, not at GitHub's 6 hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the name guard below reads every commit message.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/check-environment
        with:
          browser: 'true'
          # The install checks' own controls, for Chromium's packages and the
          # browsers: each changed one way, each refused by name.
          controls: 'true'

      - run: npm run build

      - name: No source maps in the built site
        run: npm run check-no-source-maps

      - name: No colour from the first look, in the built site too
        run: npm run check-old-colours

      - name: The built site in a browser, signed in; no request leaves it; the page policy holds
        run: npm run check-browser

      - name: Every page that prints reads right with the browser's default print (backgrounds off)
        run: npm run check-print

      - name: A person removed is named in no view of the change log -- page, PDF, Excel, print -- in either language
        run: npm run check-removed-person

      - name: Neither file maker is in the first page
        run: npm run check-first-load

      - name: Download Excel, Download PDF and Print, in a browser; every file read back
        run: npm run check-downloads

      - name: The installer drawings page -- each garage's own set, Download PDF and Print, your garage only, no session no file
        run: npm run check-drawings-browser

      - name: No name from outside this project, in the working tree and the built site
        # Tracked and untracked files and the built site, contents and paths,
        # and every commit message. Plants its own controls -- a word in a
        # file, a word in a file's name -- and requires each caught, in the
        # same run, before the real scan is read.
        run: node .github/scripts/check-no-sibling-names.js --worktree

  browser-controls:
    name: browser-controls (${{ matrix.shard }}/8)
    # The browser checks, shown failing first. Copies, each with one break,
    # must each fail naming it: an outside font link, a raw code let through,
    # the clear skipped on sign-out, an inline script, the browser's time zone
    # used, and the rest listed in scripts/fail-controls.js -- the downloads'
    # among them. Spread over 8 runners by their measured minutes; `browser`
    # below proves the shards add up to one whole run.
    runs-on: ubuntu-latest
    # Measured: the slowest run of this job, about twice over. A hang stops here, not at GitHub's 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/check-environment
        with:
          browser: 'true'
      - name: The browser checks, shown failing first (this shard)
        run: npm run fail-controls-browser -- --shard ${{ matrix.shard }}/8
      - name: This shard's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fail-controls-browser-shard-${{ matrix.shard }}
          path: fail-controls-browser-shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          overwrite: true

  browser:
    # The name branch protection requires; as `test` above, for the browser.
    name: browser
    if: always()
    needs: [browser-checks, browser-controls]
    runs-on: ubuntu-latest
    # Measured: the slowest run of this job, about twice over. A hang stops here, not at GitHub's 6 hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: fail-controls-browser-shard-*
          merge-multiple: true
          path: fail-controls-shards
      - name: Every browser control exactly once, each caught and named
        run: node scripts/fail-controls.js --browser --verify fail-controls-shards
      - name: Every part of the browser checks passed
        if: always()
        env:
          CHECKS: ${{ needs.browser-checks.result }}
          CONTROLS: ${{ needs.browser-controls.result }}
        run: |
          echo "browser-checks: $CHECKS, browser-controls: $CONTROLS"
          [ "$CHECKS" = success ] && [ "$CONTROLS" = success ]
