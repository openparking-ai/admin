name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the two guards below that read COMMIT MESSAGES would
          # see one synthetic merge commit at depth 1.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

      - name: No real personal data in the repository
        run: node .github/scripts/check-no-real-data.js --self-test

      - run: npm run check-no-real-data

      - name: No commercial value of a deployment (self-test)
        run: node .github/scripts/check-no-commercial-values.js --self-test

      - name: No commercial value of a deployment (this pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-no-commercial-values.js "$BASE..$HEAD"

      - name: No commercial value of a deployment (whole history)
        if: github.event_name != 'pull_request'
        run: node .github/scripts/check-no-commercial-values.js

      - name: No name from outside this project (self-test)
        run: node .github/scripts/check-no-sibling-names.js --self-test

      - name: No name from outside this project (this pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-no-sibling-names.js "$BASE..$HEAD"

      - name: No name from outside this project (whole history)
        if: github.event_name != 'pull_request'
        run: node .github/scripts/check-no-sibling-names.js

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The readers the downloaded files are read back with (pinned, by hash)
        run: pip install --require-hashes -r scripts/files/readers.txt
      - name: A spreadsheet app reading the Excel files back too (LibreOffice, headless)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-calc
          soffice --version

      - name: Every check below, shown failing first
        # Each control plants one break in a scratch copy of the repository
        # and requires the check to fail and name it. Nothing below is read
        # until all of them have.
        run: npm run fail-controls

      - name: No technical words, in either language
        run: npm run check-plain-words
      - name: Nothing readable outside the dictionaries
        run: npm run check-readable-text
      - name: The two languages match
        run: npm run check-languages-match
      - name: Text against background, by day and by night
        run: npm run check-contrast
      - name: No colour from the first look
        run: npm run check-old-colours
      - name: Quick Find, the look, the language, the one place that talks to the platform
        run: npm test
      - name: The page never touches the session, and asks only its own origin
        run: npm run check-page-stays-home
      - name: Home says only what it shows
        run: npm run check-home-claims
      - name: Every field has a short description, in both languages
        run: npm run check-descriptions
      - name: The downloaded files hold the list, read back by readers we did not write
        # openpyxl and pypdf, and LibreOffice reading every Excel file as a
        # spreadsheet app does. (Numbers, on a Mac: SPREADSHEET_READERS=numbers.)
        env:
          SPREADSHEET_READERS: libreoffice
        run: npm run check-files
      - name: No dependency with a known high or critical problem
        run: npm audit --audit-level=high

  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the name guard below reads every commit message.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The readers the downloaded files are read back with (pinned, by hash)
        run: pip install --require-hashes -r scripts/files/readers.txt

      - name: The browser checks, shown failing first
        # Copies, each with one break, must each fail naming it: an outside
        # font link, a raw code let through, the clear skipped on sign-out, an
        # inline script, the browser's time zone used, and the rest listed in
        # scripts/fail-controls.js -- the downloads' among them.
        run: npm run fail-controls-browser

      - run: npm run build

      - name: No source maps in the built site
        run: npm run check-no-source-maps

      - name: No colour from the first look, in the built site too
        run: npm run check-old-colours

      - name: The built site in a browser, signed in; no request leaves it; the page policy holds
        run: npm run check-browser

      - name: Neither file maker is in the first page
        run: npm run check-first-load

      - name: Download Excel, Download PDF and Print, in a browser; every file read back
        run: npm run check-downloads

      - name: No name from outside this project, in the working tree and the built site
        # Tracked and untracked files and the built site, contents and paths,
        # and every commit message. Plants its own controls -- a word in a
        # file, a word in a file's name -- and requires each caught, in the
        # same run, before the real scan is read.
        run: node .github/scripts/check-no-sibling-names.js --worktree
